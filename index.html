<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Accuracy Head Sizing</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <style>
        body {
            background-color: #1a1a1a; color: white; font-family: 'Segoe UI', sans-serif;
            margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .container {
            position: relative; width: 100%; max-width: 960px; aspect-ratio: 16/9;
            background: black; border-radius: 16px; overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }

        video { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; transform: scaleX(-1);
        }
        canvas { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            transform: scaleX(-1);
        }

        /* The Sweet Spot Guide */
        .guide-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
            display: flex; align-items: center; justify-content: center;
        }

        .face-oval {
            width: 220px; height: 300px; /* Constrained Size */
            border: 4px dashed rgba(255, 255, 255, 0.3);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            transition: all 0.3s ease;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.7); /* Dim the rest of screen */
        }
        
        .face-oval.good { border-color: #32CD32; border-style: solid; box-shadow: 0 0 20px #32CD32, 0 0 0 9999px rgba(0,0,0,0.8); }
        .face-oval.bad { border-color: #ff4757; }

        /* Status UI */
        .status-pill {
            position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); padding: 10px 30px; border-radius: 30px;
            font-size: 1.2rem; font-weight: bold; border: 1px solid #444; z-index: 20;
            white-space: nowrap; transition: background 0.3s;
        }
        .status-pill.success { background: #32CD32; color: black; }
        .status-pill.warning { background: #ff4757; }

        /* Progress Bar */
        .scan-progress {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 300px; height: 10px; background: #333; border-radius: 10px;
            overflow: hidden; z-index: 20; display: none;
        }
        .scan-bar { width: 0%; height: 100%; background: #32CD32; transition: width 0.1s linear; }

        /* Result Screen */
        .result-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10,10,10,0.95); z-index: 50;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .hidden { display: none !important; }
        .btn { padding: 15px 30px; font-size: 1.1rem; background: #007bff; color: white; border:none; border-radius:30px; cursor: pointer; margin-top: 20px;}

    </style>
</head>
<body>

<div class="container">
    <video id="input_video" playsinline></video>
    <canvas id="output_canvas"></canvas>
    
    <div id="guide" class="guide-overlay">
        <div id="oval" class="face-oval"></div>
    </div>

    <div id="status" class="status-pill">Initializing...</div>
    
    <div id="progress-container" class="scan-progress">
        <div id="bar" class="scan-bar"></div>
    </div>

    <div id="result-ui" class="result-screen hidden">
        <h1 style="color:#888; font-size:1rem; text-transform:uppercase;">Measurement Complete</h1>
        <div style="font-size: 5rem; font-weight: bold; color: #32CD32;"><span id="final-val">0</span> mm</div>
        <p style="color:#aaa; max-width:400px; text-align:center;">
            This measurement was taken from a perspective-corrected distance using multi-frame averaging.
        </p>
        <button class="btn" onclick="location.reload()">Measure Again</button>
    </div>
</div>

<script>
    /* CONFIG */
    const IRIS_REAL_MM = 11.7; 
    const SCAN_FRAMES = 60; // 60 Frames (~2 seconds) of perfect stability
    
    // Elements
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusEl = document.getElementById('status');
    const ovalEl = document.getElementById('oval');
    const barEl = document.getElementById('bar');
    const progContainer = document.getElementById('progress-container');
    const resUI = document.getElementById('result-ui');

    let state = 'align'; // align, measure, done
    let buffer = [];

    // --- CV Setup ---
    const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
    faceMesh.setOptions({maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.7});
    faceMesh.onResults(onFaceResults);

    const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
    hands.setOptions({maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.7});
    hands.onResults(onHandResults);

    const camera = new Camera(videoElement, {
        onFrame: async () => {
            await faceMesh.send({image: videoElement});
            await hands.send({image: videoElement});
        },
        width: 1280, height: 720
    });
    camera.start();

    // Globals to sync Face and Hands
    let faceData = null;

    function onFaceResults(results) {
        // Reset canvas
        canvasElement.width = videoElement.videoWidth;
        canvasElement.height = videoElement.videoHeight;
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
            faceData = results.multiFaceLandmarks[0];
            checkAlignment(faceData);
        } else {
            faceData = null;
            updateStatus("No Face Detected", "neutral");
        }
    }

    function onHandResults(results) {
        if (!faceData || state === 'done') return;

        // Draw Hands (Visual feedback)
        if (results.multiHandLandmarks) {
            for (const marks of results.multiHandLandmarks) {
                drawPoint(marks[8], 'lime'); // Index tip
            }
        }

        // Logic
        if (state === 'measure') {
            if (results.multiHandLandmarks.length === 2) {
                // Get two index fingers
                const f1 = results.multiHandLandmarks[0][8];
                const f2 = results.multiHandLandmarks[1][8];
                
                // Calculate Pixel Distance of Fingers
                const dx = (f1.x - f2.x) * canvasElement.width;
                const dy = (f1.y - f2.y) * canvasElement.height;
                const fingerPx = Math.sqrt(dx*dx + dy*dy);

                // Calculate Scale from Iris (Simultaneous)
                // Left Iris 474-476
                const w = canvasElement.width; const h = canvasElement.height;
                const i1 = faceData[474]; const i2 = faceData[476];
                const irisPx = Math.hypot((i1.x-i2.x)*w, (i1.y-i2.y)*h);
                
                const mmScale = IRIS_REAL_MM / irisPx;
                const currentMM = fingerPx * mmScale;

                // Accumulate
                buffer.push(currentMM);
                
                // Update UI Progress
                const pct = (buffer.length / SCAN_FRAMES) * 100;
                barEl.style.width = pct + "%";
                updateStatus("Hold Still... Scanning", "success");

                if (buffer.length >= SCAN_FRAMES) {
                    finishMeasurement();
                }
            } else {
                updateStatus("Place BOTH fingers on ears", "warning");
                resetScan();
            }
        }
    }

    function checkAlignment(landmarks) {
        if (state !== 'align') return;

        // Get Face Bounds (Top 10, Bottom 152)
        const top = landmarks[10].y * canvasElement.height;
        const bottom = landmarks[152].y * canvasElement.height;
        const faceH = bottom - top;
        const screenH = canvasElement.height;

        // The "Sweet Spot" Logic
        // Face should be roughly 35-45% of screen height
        // This forces user to be ~60-70cm away (Arm's length)
        const faceRatio = faceH / screenH;

        if (faceRatio > 0.50) {
            updateStatus("Too Close! Move Back", "warning");
            ovalEl.className = "face-oval bad";
            resetScan();
        } else if (faceRatio < 0.30) {
            updateStatus("Too Far! Come Closer", "warning");
            ovalEl.className = "face-oval bad";
            resetScan();
        } else {
            // Good Distance
            updateStatus("Perfect Distance. Place Fingers on Ears.", "success");
            ovalEl.className = "face-oval good";
            
            // Auto-switch to measure mode if valid
            state = 'measure';
            progContainer.style.display = 'block';
        }
    }

    function resetScan() {
        if(state === 'measure') state = 'align'; // Fallback if alignment lost
        buffer = [];
        barEl.style.width = "0%";
        progContainer.style.display = 'none';
    }

    function finishMeasurement() {
        state = 'done';
        
        // Calculate Median
        buffer.sort((a,b) => a-b);
        const result = buffer[Math.floor(buffer.length / 2)];
        
        // Display
        document.getElementById('final-val').innerText = Math.round(result);
        resUI.classList.remove('hidden');
    }

    function updateStatus(text, type) {
        statusEl.innerText = text;
        statusEl.className = 'status-pill';
        if (type === 'success') statusEl.classList.add('success');
        if (type === 'warning') statusEl.classList.add('warning');
    }

    function drawPoint(pt, color) {
        const x = pt.x * canvasElement.width;
        const y = pt.y * canvasElement.height;
        canvasCtx.beginPath();
        canvasCtx.arc(x, y, 8, 0, 2*Math.PI);
        canvasCtx.fillStyle = color;
        canvasCtx.fill();
        canvasCtx.strokeStyle = 'white';
        canvasCtx.lineWidth = 2;
        canvasCtx.stroke();
    }

</script>
</body>
</html>
