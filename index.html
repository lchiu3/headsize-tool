<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accuracy Test: Fingers vs Face Mesh</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <style>
        body { background-color: #121212; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .container { position: relative; width: 100%; max-width: 960px; aspect-ratio: 16/9; background: #000; border-radius: 20px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
        
        /* The comparison UI */
        .hud-panel {
            position: absolute; bottom: 20px; width: 90%;
            display: flex; gap: 20px; justify-content: center;
            z-index: 10;
        }
        
        .metric-card {
            background: rgba(0,0,0,0.8); padding: 15px 25px; border-radius: 15px;
            border: 1px solid #333; text-align: center; min-width: 150px;
        }
        .metric-card.red { border-top: 4px solid #ff4757; }
        .metric-card.green { border-top: 4px solid #32CD32; }
        
        .label { font-size: 0.8rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .value { font-size: 2.5rem; font-weight: bold; }
        .unit { font-size: 1rem; color: #666; }
        
        .diff-badge {
            background: #444; color: white; padding: 5px 10px; border-radius: 20px;
            font-size: 0.9rem; align-self: center; font-weight: bold;
        }

        .controls { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 20; }
        .btn { padding: 10px 20px; border-radius: 30px; border:none; background: #007bff; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <video id="input_video" playsinline></video>
    <canvas id="output_canvas"></canvas>

    <div class="controls" id="start-btn">
        <button class="btn" onclick="startCamera()">Start Comparison</button>
    </div>

    <div class="hud-panel" id="hud" style="display:none;">
        <div class="metric-card red">
            <div class="label">Face Mesh Only</div>
            <div class="value" style="color:#ff4757;"><span id="val-face">0</span></div>
            <div class="unit">mm</div>
        </div>

        <div class="diff-badge">Δ <span id="val-diff">0</span> mm</div>

        <div class="metric-card green">
            <div class="label">Finger Pointing</div>
            <div class="value" style="color:#32CD32;"><span id="val-fingers">--</span></div>
            <div class="unit">mm</div>
        </div>
    </div>
</div>

<script>
    const IRIS_REAL_MM = 11.7; 
    let scale = 0; // mm per pixel

    const videoEl = document.getElementById('input_video');
    const canvasEl = document.getElementById('output_canvas');
    const ctx = canvasEl.getContext('2d');

    async function startCamera() {
        document.getElementById('start-btn').style.display = 'none';
        document.getElementById('hud').style.display = 'flex';

        const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
        faceMesh.setOptions({maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.7});
        faceMesh.onResults(onFaceResults);

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.7});
        hands.onResults(onHandResults);

        const camera = new Camera(videoEl, {
            onFrame: async () => {
                await faceMesh.send({image: videoEl});
                await hands.send({image: videoEl});
            },
            width: 1280, height: 720
        });
        camera.start();
    }

    // SHARED STATE
    let currentFaceMM = 0;
    let currentFingerMM = 0;

    function onFaceResults(results) {
        canvasEl.width = videoEl.videoWidth;
        canvasEl.height = videoEl.videoHeight;
        const w = canvasEl.width; const h = canvasEl.height;
        
        // Clear canvas every frame
        ctx.clearRect(0, 0, w, h);

        if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) return;
        const lm = results.multiFaceLandmarks[0];

        // 1. CALIBRATE SCALE (Live Iris)
        const getDist = (i1, i2) => Math.hypot((lm[i1].x-lm[i2].x)*w, (lm[i1].y-lm[i2].y)*h);
        const irisPx = (getDist(474,476) + getDist(469,471)) / 2;
        scale = IRIS_REAL_MM / irisPx;

        // 2. MEASURE A: Face Mesh (Tragion to Tragion)
        // Landmarks: 234 (Left Ear), 454 (Right Ear)
        const lEar = lm[234];
        const rEar = lm[454];

        // Draw Red Line (Mesh)
        ctx.strokeStyle = '#ff4757'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(lEar.x*w, lEar.y*h); ctx.lineTo(rEar.x*w, rEar.y*h); ctx.stroke();
        
        // Draw Dots
        ctx.fillStyle = '#ff4757';
        ctx.beginPath(); ctx.arc(lEar.x*w, lEar.y*h, 5, 0, 2*Math.PI); ctx.fill();
        ctx.beginPath(); ctx.arc(rEar.x*w, rEar.y*h, 5, 0, 2*Math.PI); ctx.fill();

        const facePx = Math.hypot((lEar.x-rEar.x)*w, (lEar.y-rEar.y)*h);
        currentFaceMM = Math.round(facePx * scale);
        
        document.getElementById('val-face').innerText = currentFaceMM;
        updateDiff();
    }

    function onHandResults(results) {
        if (!results.multiHandLandmarks || results.multiHandLandmarks.length !== 2) {
            document.getElementById('val-fingers').innerText = "--";
            currentFingerMM = 0;
            return;
        }

        const w = canvasEl.width; const h = canvasEl.height;
        const f1 = results.multiHandLandmarks[0][8]; // Index Tip
        const f2 = results.multiHandLandmarks[1][8];

        // 3. MEASURE B: Fingers
        // Draw Green Line
        ctx.strokeStyle = '#32CD32'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(f1.x*w, f1.y*h); ctx.lineTo(f2.x*w, f2.y*h); ctx.stroke();

        // Draw Dots
        ctx.fillStyle = '#32CD32';
        ctx.beginPath(); ctx.arc(f1.x*w, f1.y*h, 8, 0, 2*Math.PI); ctx.fill();
        ctx.beginPath(); ctx.arc(f2.x*w, f2.y*h, 8, 0, 2*Math.PI); ctx.fill();

        const fingerPx = Math.hypot((f1.x-f2.x)*w, (f1.y-f2.y)*h);
        currentFingerMM = Math.round(fingerPx * scale);

        document.getElementById('val-fingers').innerText = currentFingerMM;
        updateDiff();
    }

    function updateDiff() {
        if(currentFingerMM > 0 && currentFaceMM > 0) {
            const diff = currentFingerMM - currentFaceMM;
            const el = document.getElementById('val-diff');
            el.innerText = (diff > 0 ? "+" : "") + diff;
            
            // Color logic
            if(Math.abs(diff) > 10) el.parentElement.style.background = "#ffcc00"; // Big diff warning
            else el.parentElement.style.background = "#444";
        }
    }
</script>
</body>
</html>
