<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headphone Sizing - Perspective Corrected</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    
    <style>
        body { background-color: #1a1a1a; color: white; font-family: sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .container { position: relative; width: 100%; max-width: 960px; aspect-ratio: 16/9; background: black; border-radius: 16px; overflow: hidden; display: flex; }
        .viewport { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
        .ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; }
        .top-bar { background: rgba(0,0,0,0.6); padding: 15px 30px; border-radius: 30px; text-align: center; align-self: center; border: 1px solid rgba(255,255,255,0.1); }
        .guide-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 280px; height: 380px; border: 2px dashed rgba(255,255,255,0.3); border-radius: 140px; }
        .progress-dots { display: flex; gap: 10px; margin-top: 10px; justify-content: center;}
        .dot { width: 12px; height: 12px; border-radius: 50%; background: #444; border: 1px solid #666; transition: all 0.3s; }
        .dot.active { background: #007bff; box-shadow: 0 0 10px #007bff; border-color: #fff; }
        .dot.success { background: #28a745; box-shadow: 0 0 10px #28a745; border-color: #fff; }
        .btn { background: #007bff; color: white; border: none; padding: 12px 25px; border-radius: 50px; font-weight: 600; cursor: pointer; pointer-events: auto; }
        .hidden { display: none !important; }
        
        /* New Result UI */
        .result-box { background: rgba(20, 20, 20, 0.95); padding: 40px; border-radius: 20px; text-align: center; border: 1px solid #333; }
        .result-value { font-size: 5rem; color: #28a745; font-weight: bold; margin: 0; }
        .fine-tune { margin-top: 20px; display: flex; gap: 10px; justify-content: center; align-items: center; font-size: 0.9rem; color: #aaa; }
    </style>
</head>
<body>

<div class="container">
    <div class="viewport">
        <video id="input_video" playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <div id="ui-intro" class="ui-overlay" style="background: rgba(0,0,0,0.85); pointer-events: auto; align-items: center; justify-content: center;">
        <h1 style="margin-bottom: 1rem;">Head Measurement V2</h1>
        <p style="text-align: center; margin-bottom: 2rem; max-width: 500px;">
            This version corrects for camera distortion.<br><br>
            Slowly turn your head <b>Left, Right, Up, Down</b>.
        </p>
        <button class="btn" onclick="startApp()">Start Calibration</button>
    </div>

    <div id="ui-active" class="ui-overlay hidden">
        <div class="top-bar">
            <h2 id="instruction-text" style="margin:0; font-size:1.2rem;">Center your face</h2>
        </div>
        <div class="guide-box"></div>
        <div style="position: absolute; bottom: 50px; left: 0; width: 100%; text-align: center;">
            <div class="progress-dots">
                <div class="dot" id="dot-left"></div>
                <div class="dot" id="dot-center"></div>
                <div class="dot" id="dot-right"></div>
                <div class="dot" id="dot-up"></div>
                <div class="dot" id="dot-down"></div>
            </div>
        </div>
    </div>

    <div id="ui-result" class="ui-overlay hidden" style="pointer-events: auto; align-items: center; justify-content: center;">
        <div class="result-box">
            <span style="text-transform: uppercase; letter-spacing: 1px; color: #888;">Head Width</span>
            <div class="result-value"><span id="final-width">0</span> mm</div>
            <p style="color: #666; margin-top: -10px; font-size: 0.9rem;">Includes depth compensation</p>
            
            <div class="fine-tune">
                <span>Adjust Estimate:</span>
                <button class="btn" style="padding: 5px 15px; font-size: 1rem; background: #444;" onclick="adjust(-2)">-</button>
                <button class="btn" style="padding: 5px 15px; font-size: 1rem; background: #444;" onclick="adjust(2)">+</button>
            </div>
            <br>
            <button class="btn" onclick="location.reload()">Measure Again</button>
        </div>
    </div>
</div>

<script>
    /* CONFIGURATION 
       -----------------------------------------------------------
       PERSPECTIVE_FACTOR: 
       We multiply the raw result by this to account for the ears being 
       further back than the eyes (where the scale is derived).
       1.12 = +12% size boost (Typical for laptop webcams at ~50cm distance)
    */
    const PERSPECTIVE_FACTOR = 1.12; 
    const IRIS_REF_MM = 11.7;

    let state = {
        step: 'intro',
        buckets: { center:[], left:[], right:[], up:[], down:[] },
        finalVal: 0
    };

    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const uiIntro = document.getElementById('ui-intro');
    const uiActive = document.getElementById('ui-active');
    const uiResult = document.getElementById('ui-result');
    const instrText = document.getElementById('instruction-text');

    // Setup Face Mesh
    const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
    faceMesh.onResults(onResults);

    const camera = new Camera(videoElement, {
        onFrame: async () => { await faceMesh.send({image: videoElement}); },
        width: 1280, height: 720
    });

    function startApp() {
        uiIntro.classList.add('hidden');
        uiActive.classList.remove('hidden');
        state.step = 'scanning';
        camera.start();
    }

    function onResults(results) {
        canvasElement.width = videoElement.videoWidth;
        canvasElement.height = videoElement.videoHeight;
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

        if (!results.multiFaceLandmarks || results.multiFaceLandmarks.length === 0) return;
        
        const landmarks = results.multiFaceLandmarks[0];
        const w = canvasElement.width;
        const h = canvasElement.height;

        // 1. Calculate Pose (Yaw/Pitch)
        const nose = landmarks[1];
        const leftEar = landmarks[234];  // Tragion Left
        const rightEar = landmarks[454]; // Tragion Right
        
        // Yaw Estimation
        const midX = (leftEar.x + rightEar.x) / 2;
        const faceW = Math.abs(leftEar.x - rightEar.x);
        const yaw = (nose.x - midX) / faceW * 2.5; // Approx -1 to 1

        // Pitch Estimation
        const forehead = landmarks[10];
        const chin = landmarks[152];
        const midY = (forehead.y + chin.y) / 2;
        const faceH = Math.abs(forehead.y - chin.y);
        const pitch = (nose.y - midY) / faceH * 2.5;

        // Visual Feedback
        drawConnectors(canvasCtx, landmarks, FACEMESH_TESSELATION, {color: '#C0C0C070', lineWidth: 1});
        
        if (state.step === 'scanning') {
            collectData(landmarks, yaw, pitch, w, h);
        }
    }

    function collectData(lm, yaw, pitch, w, h) {
        const TOL = 0.2; // Tolerance
        const SAMPLES = 20;

        let bucket = null;
        if (Math.abs(yaw) < 0.1 && Math.abs(pitch) < 0.1) bucket = 'center';
        else if (yaw < -0.4) bucket = 'right'; // Mirror
        else if (yaw > 0.4) bucket = 'left';
        else if (pitch < -0.3) bucket = 'down'; // Inverted Y
        else if (pitch > 0.3) bucket = 'up';

        // UI Updates
        let status = "Look Center";
        if (!isFull('center')) status = "Look Center";
        else if (!isFull('left')) status = "Turn Head Left";
        else if (!isFull('right')) status = "Turn Head Right";
        else if (!isFull('up')) status = "Look Up";
        else if (!isFull('down')) status = "Look Down";
        else status = "Processing...";
        
        instrText.innerText = status;

        if (bucket && !isFull(bucket)) {
            // Highlight dot
            document.getElementById(`dot-${bucket}`).classList.add('active');

            // --- KEY MEASUREMENT LOGIC ---
            
            // 1. Iris Size (The Ruler)
            // Left Iris: 474-476, Right Iris: 469-471
            const d = (i1, i2) => Math.hypot((lm[i1].x-lm[i2].x)*w, (lm[i1].y-lm[i2].y)*h);
            const irisPx = (d(474,476) + d(469,471)) / 2;

            // 2. Head Width (The Object)
            // Using 234 and 454 (Tragions/Ears) - widest stable points
            const headPx = Math.hypot((lm[234].x-lm[454].x)*w, (lm[234].y-lm[454].y)*h);

            state.buckets[bucket].push({ iris: irisPx, head: headPx });

            if (isFull(bucket)) {
                document.getElementById(`dot-${bucket}`).classList.remove('active');
                document.getElementById(`dot-${bucket}`).classList.add('success');
                checkDone();
            }
        }
    }

    function isFull(b) { return state.buckets[b].length >= 20; }

    function checkDone() {
        const b = state.buckets;
        if (isFull('center') && isFull('left') && isFull('right') && isFull('up') && isFull('down')) {
            state.step = 'done';
            computeSize();
        }
    }

    function computeSize() {
        // 1. Robust Scale (Median of ALL buckets)
        let allIris = [];
        Object.values(state.buckets).forEach(arr => arr.forEach(d => allIris.push(d.iris)));
        allIris.sort((a,b)=>a-b);
        const medianIris = allIris[Math.floor(allIris.length/2)];
        
        // mm per pixel at eye depth
        const mmPerPx = IRIS_REF_MM / medianIris;

        // 2. Robust Width (Median of CENTER bucket)
        let centerWidths = state.buckets.center.map(d => d.head);
        centerWidths.sort((a,b)=>a-b);
        const medianHeadPx = centerWidths[Math.floor(centerWidths.length/2)];

        // 3. Calculation with Perspective Compensation
        const rawMM = medianHeadPx * mmPerPx;
        const correctedMM = rawMM * PERSPECTIVE_FACTOR; // The Magic Fix

        state.finalVal = Math.round(correctedMM);
        
        document.getElementById('final-width').innerText = state.finalVal;
        uiActive.classList.add('hidden');
        uiResult.classList.remove('hidden');
    }

    function adjust(amount) {
        state.finalVal += amount;
        document.getElementById('final-width').innerText = state.finalVal;
    }

</script>
</body>
</html>
